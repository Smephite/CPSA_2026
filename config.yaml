# config.yaml: site settings for the Guardian Node.
#
# Logging keys are read by utils/config.py + utils/logger.py (from upstream CPSA_2026).
# Guardian settings: every default, with a comment, is in utils/settings.py. Override any of them in the
# `guardian:` section below (same nesting), e.g.
#
#   guardian:
#     camera: {focal_px: 610.0}
#     rules: {static_lines: [[0.0, 0.9, 1.0, 0.9]]}
#
# Live changes from the web UI are saved to guardian_tuning.json, which is applied on top of this file.
# Upstream's device settings (MetaMotion, BT speaker, LED strip, IMU) are in legacy/config.yaml.

log_base_path: logs            # relative to the working directory (the board runs as root)
enable_system_log: true        # write system messages to <log_base_path>/<date>/System_Log.log
enable_actuation_detail: false # add actuator parameters to event diary lines
debug_system_console: true     # print system messages
debug_event_console: true      # print event diary lines

guardian: {}
